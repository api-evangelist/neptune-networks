name: Neptune Networks
description: >-
  Neptune Networks operates Neptune, an institutional fixed-income pre-trade
  data platform that delivers real-time dealer axes and bond inventory directly
  into buy-side workflows. Aggregating structured data from 34 global banks,
  the network surfaces roughly 110k bonds per day at around $2.2T daily gross
  notional across 33 currencies, helping asset managers identify liquidity
  opportunities before they trade. Originally an independent, bank-owned utility
  backed by Anthemis, Neptune is now operated as RealQ, the data-solutions arm
  of Liquidnet Fixed Income (part of TP ICAP Group). Connectivity is
  institutional and permissioned - a browser web app, OMS/EMS integrations, FIX,
  a REST API, FTP/SSH drop copy, and AWS cloud data transfer - with no public
  developer portal, published OpenAPI, or open SDKs.
